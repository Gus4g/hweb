<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Sencilla</title>
    <style type="text/css">
        td, th { border: 1px solid #CCC; }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th scope="col">7:00pm</th>
                <th scope="col">7:30pm</th>
                <th scope="col">8:00pm</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="3">The Sunday Night Movie</td>
            </tr>
            <tr>
                <td>Perry Mason</td>
                <td>Candid Camera</td>
                <td>What´s My Line</td>
            </tr>
            <tr>
                <td>Bonanza</td>
                <td colspan="2">The Wackiest Ship in the Army</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
