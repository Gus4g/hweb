<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinacion de filas</title>
    <style type="text/css">
        td { border: 1px solid #CCC; padding: 5px; }
    </style>
</head>
<body>
    <table>
        <tbody>
            <tr>
                <td>apples</td>
                <td rowspan="3">oranges</td>
                <td>pears</td>
            </tr>
            <tr>
                <td>bananas</td>
                <td rowspan="2">pineapple</td>
            </tr>
            <tr>
                <td>lychees</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
